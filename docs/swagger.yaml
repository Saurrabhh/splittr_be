components:
  schemas:
    activity.ActionType:
      enum:
      - EXPENSE_CREATED
      - SETTLEMENT
      - MEMBER_ADDED
      - MEMBER_LEFT
      - MEMBER_KICKED
      - MEMBER_ROLE_UPDATED
      - GROUP_CREATED
      - GROUP_ARCHIVED
      - MEMBER_JOINED
      type: string
      x-enum-varnames:
      - ActionTypeExpenseCreated
      - ActionTypeSettlementCreated
      - ActionTypeMemberAdded
      - ActionTypeMemberLeft
      - ActionTypeMemberKicked
      - ActionTypeMemberRoleUpdated
      - ActionTypeGroupCreated
      - ActionTypeGroupArchived
      - ActionTypeMemberJoined
    activity.Activity:
      properties:
        actionType:
          $ref: '#/components/schemas/activity.ActionType'
        actorId:
          type: string
        actorName:
          type: string
        createdAt:
          type: string
        description:
          type: string
        entityId:
          type: string
        entityType:
          $ref: '#/components/schemas/activity.EntityType'
        groupId:
          type: string
        id:
          type: string
        metadata:
          description: 'Snapshot metadata. Shape matches the entity response: EXPENSE
            (CreateExpenseResponse), SETTLEMENT (SettleExpenseResponse), MEMBER (Member),
            GROUP (GroupDetailsResponse)'
          type: object
      type: object
    activity.ActorInfo:
      properties:
        id:
          type: string
        name:
          type: string
      type: object
    activity.EntityType:
      enum:
      - SYSTEM
      - EXPENSE
      - SETTLEMENT
      - MEMBER
      - GROUP
      type: string
      x-enum-varnames:
      - EntityTypeSystem
      - EntityTypeExpense
      - EntityTypeSettlement
      - EntityTypeMember
      - EntityTypeGroup
    activity.FeedItemResponse:
      properties:
        actionType:
          $ref: '#/components/schemas/activity.ActionType'
        actor:
          $ref: '#/components/schemas/activity.ActorInfo'
        createdAt:
          type: string
        description:
          type: string
        entityId:
          type: string
        entityType:
          $ref: '#/components/schemas/activity.EntityType'
        id:
          type: string
        payload:
          description: 'Verbatim entity snapshot. Shape matches the entity response:
            EXPENSE (CreateExpenseResponse), SETTLEMENT (SettleExpenseResponse), MEMBER
            (Member), GROUP (GroupDetailsResponse)'
          type: object
      type: object
    activity.FeedResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/activity.FeedItemResponse'
          type: array
          uniqueItems: false
        pagination:
          $ref: '#/components/schemas/pagination.Meta'
      type: object
    activity.ListActivitiesResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/activity.Activity'
          type: array
          uniqueItems: false
        pagination:
          $ref: '#/components/schemas/pagination.Meta'
      type: object
    expense.BalanceResponse:
      properties:
        balances:
          items:
            $ref: '#/components/schemas/expense.UserBalance'
          type: array
          uniqueItems: false
        settlements:
          items:
            $ref: '#/components/schemas/expense.Settlement'
          type: array
          uniqueItems: false
      type: object
    expense.CreateExpenseResponse:
      properties:
        expense:
          $ref: '#/components/schemas/expense.Expense'
        splits:
          items:
            $ref: '#/components/schemas/expense.Split'
          type: array
          uniqueItems: false
      type: object
    expense.Expense:
      properties:
        amount:
          type: number
        category:
          type: string
        createdAt:
          type: string
        createdBy:
          type: string
        currency:
          type: string
        deletedAt:
          type: string
        description:
          type: string
        groupId:
          type: string
        id:
          type: string
        isPayment:
          type: boolean
        paidBy:
          type: string
        spentAt:
          type: string
        updatedAt:
          type: string
      type: object
    expense.GetExpenseDetailsResponse:
      properties:
        expense:
          $ref: '#/components/schemas/expense.Expense'
        splits:
          items:
            $ref: '#/components/schemas/expense.Split'
          type: array
          uniqueItems: false
      type: object
    expense.InputSplit:
      properties:
        amount:
          description: Required if splitType is EXACT
          type: number
        percentage:
          description: Required if splitType is PERCENTAGE
          type: number
        userId:
          type: string
      type: object
    expense.ListExpensesResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/expense.Expense'
          type: array
          uniqueItems: false
        pagination:
          $ref: '#/components/schemas/pagination.Meta'
      type: object
    expense.SettleExpenseResponse:
      properties:
        expense:
          $ref: '#/components/schemas/expense.Expense'
        split:
          $ref: '#/components/schemas/expense.Split'
      type: object
    expense.Settlement:
      properties:
        amount:
          type: number
        fromUserId:
          type: string
        fromUserName:
          type: string
        toUserId:
          type: string
        toUserName:
          type: string
      type: object
    expense.Split:
      properties:
        amount:
          type: number
        email:
          type: string
        expenseId:
          type: string
        name:
          type: string
        phone:
          type: string
        splitType:
          $ref: '#/components/schemas/expense.SplitType'
        splitValue:
          type: number
        userId:
          type: string
      type: object
    expense.SplitType:
      enum:
      - EQUAL
      - EXACT
      - PERCENTAGE
      type: string
      x-enum-varnames:
      - SplitTypeEqual
      - SplitTypeExact
      - SplitTypePercentage
    expense.UserBalance:
      properties:
        netBalance:
          type: number
        userId:
          type: string
        userName:
          type: string
      type: object
    expense.createExpenseRequest:
      properties:
        amount:
          type: number
        category:
          type: string
        currency:
          type: string
        description:
          type: string
        groupId:
          type: string
        paidBy:
          type: string
        splitType:
          $ref: '#/components/schemas/expense.SplitType'
        splits:
          items:
            $ref: '#/components/schemas/expense.InputSplit'
          type: array
          uniqueItems: false
      type: object
    expense.settleExpenseRequest:
      properties:
        amount:
          type: number
        currency:
          type: string
        groupId:
          type: string
        paidBy:
          type: string
        receivedBy:
          type: string
      type: object
    group.Group:
      properties:
        archivedAt:
          type: string
        createdAt:
          type: string
        createdBy:
          type: string
        description:
          type: string
        id:
          type: string
        inviteCode:
          type: string
        name:
          type: string
        updatedAt:
          type: string
      type: object
    group.GroupDetailsResponse:
      properties:
        archivedAt:
          type: string
        createdAt:
          type: string
        createdBy:
          type: string
        description:
          type: string
        id:
          type: string
        inviteCode:
          type: string
        members:
          items:
            $ref: '#/components/schemas/group.Member'
          type: array
          uniqueItems: false
        name:
          type: string
        updatedAt:
          type: string
      type: object
    group.ListGroupsResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/group.GroupDetailsResponse'
          type: array
          uniqueItems: false
        pagination:
          $ref: '#/components/schemas/pagination.Meta'
      type: object
    group.Member:
      properties:
        email:
          type: string
        groupId:
          type: string
        joinedAt:
          type: string
        name:
          type: string
        phone:
          type: string
        role:
          type: string
        userId:
          type: string
      type: object
    group.addMemberRequest:
      properties:
        userId:
          type: string
      type: object
    group.createGroupRequest:
      properties:
        description:
          type: string
        name:
          type: string
      type: object
    group.joinGroupRequest:
      properties:
        inviteCode:
          type: string
      type: object
    group.updateRoleRequest:
      properties:
        role:
          type: string
      type: object
    notification.ListNotificationsResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/notification.Notification'
          type: array
          uniqueItems: false
        pagination:
          $ref: '#/components/schemas/pagination.Meta'
      type: object
    notification.Notification:
      properties:
        activityId:
          type: string
        actorId:
          type: string
        actorName:
          type: string
        content:
          type: string
        createdAt:
          type: string
        id:
          type: string
        isRead:
          type: boolean
        title:
          type: string
        userId:
          type: string
      type: object
    pagination.Meta:
      properties:
        hasMore:
          type: boolean
        nextCursor:
          type: string
      type: object
    response.ErrorResponse:
      properties:
        code:
          type: string
        message:
          type: string
      type: object
    response.MessageResponse:
      properties:
        message:
          type: string
      type: object
    user.ListFriendsResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/user.User'
          type: array
          uniqueItems: false
        pagination:
          $ref: '#/components/schemas/pagination.Meta'
      type: object
    user.User:
      properties:
        createdAt:
          type: string
        defaultCurrency:
          type: string
        email:
          type: string
        id:
          type: string
        name:
          type: string
        phone:
          type: string
        updatedAt:
          type: string
      type: object
    user.addFriendRequest:
      properties:
        friendEmail:
          type: string
        friendPhone:
          type: string
      type: object
    user.registerRequest:
      properties:
        name:
          type: string
      type: object
    user.updateProfileRequest:
      properties:
        defaultCurrency:
          type: string
        name:
          type: string
      type: object
  securitySchemes:
    BearerAuth:
      scheme: bearer
      type: http
externalDocs:
  description: ""
  url: ""
info:
  description: Backend API service for Splittr bill splitting.
  title: Splittr API
  version: "1.0"
openapi: 3.1.0
paths:
  /activities:
    get:
      description: Get a cursor-paginated list of activities visible to the current
        user.
      parameters:
      - description: Items per page (max 100, default 20)
        in: query
        name: limit
        schema:
          type: integer
      - description: Opaque cursor token from a previous response
        in: query
        name: cursor
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/activity.ListActivitiesResponse'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: List activity feed
      tags:
      - activities
  /balances:
    get:
      description: Calculate net balances and recommended settlement transactions.
      parameters:
      - description: Filter by Group ID. If omitted, returns global balances.
        in: query
        name: groupId
        schema:
          type: string
      - description: Simplify debts algorithm (true/false)
        in: query
        name: simplified
        schema:
          type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/expense.BalanceResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Get user balances
      tags:
      - expenses
  /expenses:
    get:
      description: Retrieve a cursor-paginated list of expenses filtered by group,
        personal=true, or friendId.
      parameters:
      - description: Filter by Group ID
        in: query
        name: groupId
        schema:
          type: string
      - description: Filter for personal only (true/false)
        in: query
        name: personal
        schema:
          type: boolean
      - description: Filter by Friend ID
        in: query
        name: friendId
        schema:
          type: string
      - description: Items per page (max 100, default 20)
        in: query
        name: limit
        schema:
          type: integer
      - description: Opaque cursor token from a previous response
        in: query
        name: cursor
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/expense.ListExpensesResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: List expenses
      tags:
      - expenses
    post:
      description: Create a new expense with equal/exact/percentage splits.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/expense.createExpenseRequest'
                description: Expense details and splits structure
                summary: request
        description: Expense details and splits structure
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/expense.CreateExpenseResponse'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Create expense
      tags:
      - expenses
  /expenses/{id}:
    delete:
      description: Soft-delete an expense by ID.
      parameters:
      - description: Expense ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Delete expense
      tags:
      - expenses
    get:
      description: Get a specific expense's details including all splits.
      parameters:
      - description: Expense ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/expense.GetExpenseDetailsResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Get expense details
      tags:
      - expenses
  /expenses/settle:
    post:
      description: Create a settlement payment between two users.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/expense.settleExpenseRequest'
                description: Settlement details
                summary: request
        description: Settlement details
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/expense.SettleExpenseResponse'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Settle balance
      tags:
      - expenses
  /friends:
    get:
      description: Get a cursor-paginated list of the current user's friends.
      parameters:
      - description: Items per page (max 100, default 20)
        in: query
        name: limit
        schema:
          type: integer
      - description: Opaque cursor token from a previous response
        in: query
        name: cursor
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/user.ListFriendsResponse'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: List friends
      tags:
      - friends
    post:
      description: Create a friendship link with another user by their email or phone.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/user.addFriendRequest'
                description: Friend email or phone
                summary: request
        description: Friend email or phone
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/user.User'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Add friend
      tags:
      - friends
  /friends/{friendId}:
    delete:
      description: Delete a friendship link by friend ID.
      parameters:
      - description: Friend ID
        in: path
        name: friendId
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Remove friend
      tags:
      - friends
  /groups:
    get:
      description: Retrieve a cursor-paginated list of groups the current user belongs
        to.
      parameters:
      - description: Items per page (max 100, default 20)
        in: query
        name: limit
        schema:
          type: integer
      - description: Opaque cursor token from a previous response
        in: query
        name: cursor
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/group.ListGroupsResponse'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: List groups
      tags:
      - groups
    post:
      description: Create a new bill-splitting group.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/group.createGroupRequest'
                description: Group creation data
                summary: request
        description: Group creation data
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/group.Group'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Create group
      tags:
      - groups
  /groups/{id}:
    delete:
      description: Soft-delete a bill splitting group. Only group creators can archive.
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.MessageResponse'
          description: Success message
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Archive group
      tags:
      - groups
    get:
      description: Get a group's metadata and a list of all its members.
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/group.GroupDetailsResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Get group details
      tags:
      - groups
  /groups/{id}/feed:
    get:
      description: Get a cursor-paginated timeline of events inside a group.
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Items per page (max 100, default 20)
        in: query
        name: limit
        schema:
          type: integer
      - description: Opaque cursor token from previous response
        in: query
        name: cursor
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/activity.FeedResponse'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
