basePath: /v1
definitions:
  Activity:
    properties:
      actionType:
        $ref: '#/definitions/Activity.ActionType'
      actor:
        $ref: '#/definitions/Activity.ActorInfo'
      createdAt:
        type: string
      description:
        type: string
      entityId:
        type: string
      entityType:
        $ref: '#/definitions/Activity.EntityType'
      groupId:
        type: string
      id:
        type: string
      payload:
        type: object
    type: object
  Activity.ActionType:
    enum:
    - EXPENSE_CREATED
    - SETTLEMENT
    - MEMBER_ADDED
    - MEMBER_LEFT
    - MEMBER_KICKED
    - MEMBER_ROLE_UPDATED
    - GROUP_CREATED
    - GROUP_UPDATED
    - GROUP_ARCHIVED
    - MEMBER_JOINED
    type: string
    x-enum-varnames:
    - ActionTypeExpenseCreated
    - ActionTypeSettlementCreated
    - ActionTypeMemberAdded
    - ActionTypeMemberLeft
    - ActionTypeMemberKicked
    - ActionTypeMemberRoleUpdated
    - ActionTypeGroupCreated
    - ActionTypeGroupUpdated
    - ActionTypeGroupArchived
    - ActionTypeMemberJoined
  Activity.Activity:
    properties:
      actionType:
        $ref: '#/definitions/Activity.ActionType'
      actor:
        $ref: '#/definitions/Activity.ActorInfo'
      createdAt:
        type: string
      description:
        type: string
      entityId:
        type: string
      entityType:
        $ref: '#/definitions/Activity.EntityType'
      groupId:
        type: string
      id:
        type: string
      payload:
        type: object
    type: object
  Activity.ActorInfo:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  Activity.EntityType:
    enum:
    - EXPENSE
    - SETTLEMENT
    - MEMBER
    - GROUP
    type: string
    x-enum-varnames:
    - EntityTypeExpense
    - EntityTypeSettlement
    - EntityTypeMember
    - EntityTypeGroup
  AppConfig.AppConfigData:
    properties:
      domain:
        $ref: '#/definitions/AppConfig.DomainConfig'
      featureFlags:
        additionalProperties:
          type: boolean
        type: object
      legal:
        $ref: '#/definitions/AppConfig.LegalConfig'
      system:
        $ref: '#/definitions/AppConfig.SystemConfig'
      userContext:
        $ref: '#/definitions/AppConfig.UserContext'
    type: object
  AppConfig.AppConfigMeta:
    properties:
      configVersion:
        type: string
      serverTime:
        type: string
    type: object
  AppConfig.AppConfigResponse:
    properties:
      data:
        $ref: '#/definitions/AppConfig.AppConfigData'
      meta:
        $ref: '#/definitions/AppConfig.AppConfigMeta'
    type: object
  AppConfig.AppVersion:
    properties:
      forceUpdate:
        type: boolean
      latestVersion:
        type: string
      minSupportedVersion:
        type: string
      updateMessage:
        type: string
      updateUrl:
        additionalProperties:
          type: string
        type: object
    type: object
  AppConfig.Category:
    properties:
      iconUrl:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  AppConfig.Currency:
    properties:
      code:
        type: string
      decimalPlaces:
        type: integer
      isDefault:
        type: boolean
      name:
        type: string
      symbol:
        type: string
    type: object
  AppConfig.DomainConfig:
    properties:
      categories:
        items:
          $ref: '#/definitions/AppConfig.Category'
        type: array
      currencies:
        items:
          $ref: '#/definitions/AppConfig.Currency'
        type: array
      limits:
        $ref: '#/definitions/AppConfig.LimitsConfig'
      paymentIntegrations:
        items:
          $ref: '#/definitions/AppConfig.PaymentIntegration'
        type: array
      splitTypes:
        items:
          $ref: '#/definitions/AppConfig.SplitTypeConfig'
        type: array
    type: object
  AppConfig.LegalConfig:
    properties:
      faqUrl:
        type: string
      privacyPolicyUrl:
        type: string
      supportEmail:
        type: string
      termsOfServiceUrl:
        type: string
    type: object
  AppConfig.LimitsConfig:
    properties:
      allowedReceiptMimeTypes:
        items:
          type: string
        type: array
      maxExpenseAmount:
        type: number
      maxGroupMembers:
        type: integer
      maxReceiptSizeMb:
        type: integer
      maxSplitParticipants:
        type: integer
    type: object
  AppConfig.MaintenanceConfig:
    properties:
      estimatedEndTime:
        type: string
      inMaintenance:
        type: boolean
      message:
        type: string
      readOnlyMode:
        type: boolean
    type: object
  AppConfig.PaymentIntegration:
    properties:
      deepLinkScheme:
        type: string
      enabled:
        type: boolean
      id:
        type: string
      name:
        type: string
    type: object
  AppConfig.SplitTypeConfig:
    properties:
      code:
        type: string
      description:
        type: string
      label:
        type: string
    type: object
  AppConfig.SystemConfig:
    properties:
      appVersion:
        $ref: '#/definitions/AppConfig.AppVersion'
      maintenance:
        $ref: '#/definitions/AppConfig.MaintenanceConfig'
    type: object
  AppConfig.UserContext:
    properties:
      isAuthenticated:
        type: boolean
      userFeatureFlags:
        additionalProperties: true
        type: object
      userPreferredCurrency:
        type: string
    type: object
  Common.ErrorCode:
    enum:
    - BAD_REQUEST
    - UNAUTHORIZED
    - FORBIDDEN
    - NOT_FOUND
    - INTERNAL_SERVER_ERROR
    - INVALID_BODY
    - USER_NOT_FOUND
    type: string
    x-enum-varnames:
    - ErrBadRequest
    - ErrUnauthorized
    - ErrForbidden
    - ErrNotFound
    - ErrInternalServerError
    - ErrInvalidBody
    - ErrUserNotFound
  Common.ErrorResponse:
    properties:
      code:
        $ref: '#/definitions/Common.ErrorCode'
      message:
        type: string
    type: object
  Common.MessageResponse:
    properties:
      message:
        type: string
    type: object
  Expense.BalanceResponse:
    properties:
      balances:
        items:
          $ref: '#/definitions/Expense.UserBalance'
        type: array
      settlements:
        items:
          $ref: '#/definitions/Expense.Settlement'
        type: array
    type: object
  Expense.CreateRequest:
    properties:
      amount:
        type: number
      category:
        type: string
      currency:
        type: string
      description:
        type: string
      groupId:
        type: string
      paidBy:
        type: string
      splitType:
        $ref: '#/definitions/Expense.SplitType'
      splits:
        items:
          $ref: '#/definitions/Expense.InputSplit'
        type: array
    type: object
  Expense.ExpenseSyncResponse:
    properties:
      deletedIds:
        items:
          type: string
        type: array
      newVersion:
        type: integer
      updated:
        items:
          $ref: '#/definitions/Expense.ExpenseWithSplits'
        type: array
    type: object
  Expense.ExpenseWithSplits:
    properties:
      amount:
        type: number
      category:
        type: string
      createdAt:
        type: string
      createdBy:
        type: string
      currency:
        type: string
      deletedAt:
        type: string
      description:
        type: string
      groupId:
        type: string
      id:
        type: string
      isPayment:
        type: boolean
      paidBy:
        type: string
      spentAt:
        type: string
      splits:
        items:
          $ref: '#/definitions/Expense.Split'
        type: array
      syncVersion:
        type: integer
      updatedAt:
        type: string
    type: object
  Expense.InputSplit:
    properties:
      amount:
        description: Required if splitType is EXACT
        type: number
      percentage:
        description: Required if splitType is PERCENTAGE
        type: number
      userId:
        type: string
    type: object
  Expense.SettleRequest:
    properties:
      amount:
        type: number
      currency:
        type: string
      groupId:
        type: string
      paidBy:
        type: string
      receivedBy:
        type: string
    type: object
  Expense.Settlement:
    properties:
      amount:
        type: number
      fromUserId:
        type: string
      fromUserName:
        type: string
      toUserId:
        type: string
      toUserName:
        type: string
    type: object
  Expense.Split:
    properties:
      amount:
        type: number
      email:
        type: string
      expenseId:
        type: string
      name:
        type: string
      phone:
        type: string
      splitType:
        $ref: '#/definitions/Expense.SplitType'
      splitValue:
        type: number
      userId:
        type: string
    type: object
  Expense.SplitType:
    enum:
    - EQUAL
    - EXACT
    - PERCENTAGE
    type: string
    x-enum-varnames:
    - SplitTypeEqual
    - SplitTypeExact
    - SplitTypePercentage
  Expense.UpdateRequest:
    properties:
      amount:
        type: number
      category:
        type: string
      currency:
        type: string
      description:
        type: string
      splitType:
        $ref: '#/definitions/Expense.SplitType'
      splits:
        items:
          $ref: '#/definitions/Expense.InputSplit'
        type: array
    type: object
  Expense.UserBalance:
    properties:
      netBalance:
        type: number
      userId:
        type: string
      userName:
        type: string
    type: object
  Group.AddMembersRequest:
    properties:
      userIds:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - userIds
    type: object
  Group.CreateRequest:
    properties:
      description:
        type: string
      name:
        type: string
      requireAdminApproval:
        type: boolean
    required:
    - name
    type: object
  Group.DecideJoinRequestPayload:
    properties:
      action:
        $ref: '#/definitions/Group.JoinRequestAction'
    type: object
  Group.Group:
    properties:
      archivedAt:
        type: string
      createdAt:
        type: string
      createdBy:
        type: string
      description:
        type: string
      iconUrl:
        type: string
      id:
        type: string
      inviteCode:
        type: string
      inviteCodeExpiresAt:
        type: string
      members:
        items:
          $ref: '#/definitions/Group.Member'
        type: array
      name:
        type: string
      requireAdminApproval:
        type: boolean
      syncVersion:
        type: integer
      updatedAt:
        type: string
    type: object
  Group.GroupSyncResponse:
    properties:
      newVersion:
        type: integer
      removedGroupIds:
        items:
          type: string
        type: array
      updated:
        items:
          $ref: '#/definitions/Group.Group'
        type: array
    type: object
  Group.JoinRequest:
    properties:
      inviteCode:
        type: string
    required:
    - inviteCode
    type: object
  Group.JoinRequestAction:
    enum:
    - APPROVE
    - REJECT
    type: string
    x-enum-varnames:
    - JoinRequestActionApprove
    - JoinRequestActionReject
  Group.JoinResponse:
    properties:
      group:
        $ref: '#/definitions/Group.Group'
      message:
        type: string
      status:
        $ref: '#/definitions/Group.MemberStatus'
    type: object
  Group.Member:
    properties:
      email:
        type: string
      groupId:
        type: string
      joinedAt:
        type: string
      name:
        type: string
      phone:
        type: string
      role:
        $ref: '#/definitions/Group.MemberRole'
      status:
        $ref: '#/definitions/Group.MemberStatus'
      userId:
        type: string
    type: object
  Group.MemberRole:
    enum:
    - ADMIN
    - MEMBER
    type: string
    x-enum-varnames:
    - MemberRoleAdmin
    - MemberRoleMember
  Group.MemberStatus:
    enum:
    - ACTIVE
    - PENDING
    - REJECTED
    type: string
    x-enum-varnames:
    - MemberStatusActive
    - MemberStatusPending
    - MemberStatusRejected
  Group.Preview:
    properties:
      creatorName:
        type: string
      description:
        type: string
      memberCount:
        type: integer
      name:
        type: string
      requireAdminApproval:
        type: boolean
    type: object
  Group.UpdateRoleRequest:
    properties:
      role:
        $ref: '#/definitions/Group.MemberRole'
    type: object
  Meta:
    properties:
      hasMore:
        type: boolean
      nextCursor:
        type: string
    type: object
  Notification.AlertType:
    enum:
    - EXPENSE_ADDED
    - PAYMENT_RECEIVED
    - JOIN_REQUEST_PENDING
    - JOIN_REQUEST_APPROVED
    - JOIN_REQUEST_REJECTED
    type: string
    x-enum-varnames:
    - AlertTypeExpenseAdded
    - AlertTypePaymentReceived
    - AlertTypeJoinRequestPending
    - AlertTypeJoinRequestApproved
    - AlertTypeJoinRequestRejected
  Notification.Notification:
    properties:
      activityId:
        type: string
      actorId:
        type: string
      actorName:
        type: string
      content:
        type: string
      createdAt:
        type: string
      id:
        type: string
      isRead:
        type: boolean
      title:
        type: string
      type:
        $ref: '#/definitions/Notification.AlertType'
      userId:
        type: string
    type: object
  Page-Activity:
    properties:
      data:
        items:
          $ref: '#/definitions/Activity'
        type: array
      pagination:
        $ref: '#/definitions/Meta'
    type: object
  Page-Activity_Activity:
    properties:
      data:
        items:
          $ref: '#/definitions/Activity.Activity'
        type: array
      pagination:
        $ref: '#/definitions/Meta'
    type: object
  Page-Expense_ExpenseWithSplits:
    properties:
      data:
        items:
          $ref: '#/definitions/Expense.ExpenseWithSplits'
        type: array
      pagination:
        $ref: '#/definitions/Meta'
    type: object
  Page-Group_Group:
    properties:
      data:
        items:
          $ref: '#/definitions/Group.Group'
        type: array
      pagination:
        $ref: '#/definitions/Meta'
    type: object
  Page-Notification_Notification:
    properties:
      data:
        items:
          $ref: '#/definitions/Notification.Notification'
        type: array
      pagination:
        $ref: '#/definitions/Meta'
    type: object
  Page-User_User:
    properties:
      data:
        items:
          $ref: '#/definitions/User.User'
        type: array
      pagination:
        $ref: '#/definitions/Meta'
    type: object
  User.AddFriendRequest:
    properties:
      friendEmail:
        type: string
      friendPhone:
        type: string
    type: object
  User.FriendSyncResponse:
    properties:
      friends:
        items:
          $ref: '#/definitions/User.FriendshipSyncRecord'
        type: array
      newVersion:
        type: integer
    type: object
  User.FriendWithStatus:
    properties:
      actionUserId:
        type: string
      avatarUrl:
        type: string
      createdAt:
        type: string
      defaultCurrency:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      phone:
        type: string
      status:
        $ref: '#/definitions/User.FriendshipStatus'
      updatedAt:
        type: string
    type: object
  User.FriendshipStatus:
    enum:
    - PENDING
    - ACCEPTED
    - DECLINED
    - BLOCKED
    type: string
    x-enum-varnames:
    - Pending
    - Accepted
    - Declined
    - Blocked
  User.FriendshipSyncRecord:
    properties:
      actionUserId:
        type: string
      createdAt:
        type: string
      friendId:
        type: string
      status:
        $ref: '#/definitions/User.FriendshipStatus'
      syncVersion:
        type: integer
      updatedAt:
        type: string
      userId:
        type: string
    type: object
  User.RegisterRequest:
    properties:
      name:
        type: string
    type: object
  User.UpdateFriendStatusRequest:
    properties:
      status:
        $ref: '#/definitions/User.FriendshipStatus'
    type: object
  User.UpdateProfileRequest:
    properties:
      defaultCurrency:
        type: string
      name:
        type: string
    type: object
  User.UpdateUserSettingsRequest:
    properties:
      autoAcceptFriendRequests:
        type: boolean
    type: object
  User.User:
    properties:
      avatarUrl:
        type: string
      createdAt:
        type: string
      defaultCurrency:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      phone:
        type: string
      updatedAt:
        type: string
    type: object
  User.UserSettingsResponse:
    properties:
      autoAcceptFriendRequests:
        type: boolean
    type: object
info:
  contact: {}
  description: Backend API service for Splittr bill splitting.
  title: Splittr API
  version: "1.0"
paths:
  /activities:
    get:
      description: Get a cursor-paginated list of activities visible to the current
        user.
      parameters:
      - description: Items per page (max 100, default 20)
        in: query
        name: limit
        type: integer
      - description: Opaque cursor token from a previous response
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Page-Activity_Activity'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Common.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Common.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List activity feed
      tags:
      - activities
  /app-config:
    get:
      consumes:
      - application/json
      description: Returns app version rules, maintenance status, expense categories,
        currencies, limits, feature flags, and legal links. Supports optional Bearer
        auth and ETag caching via If-None-Match.
      parameters:
      - description: ETag hash for cache validation
        in: header
        name: If-None-Match
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AppConfig.AppConfigResponse'
        "304":
          description: Not Modified
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Common.ErrorResponse'
      summary: Fetch application startup configuration
      tags:
      - appConfig
  /balances:
    get:
      description: Calculate net balances and recommended settlement transactions.
      parameters:
      - description: Filter by Group ID. If omitted, returns global balances.
        in: query
        name: groupId
        type: string
      - description: Simplify debts algorithm (true/false)
        in: query
        name: simplified
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Expense.BalanceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Common.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Common.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Common.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get user balances
      tags:
      - expenses
  /expenses:
    get:
      description: Retrieve a cursor-paginated list of expenses with splits, filtered
        by group, personal=true, or friendId.
      parameters:
      - description: Filter by Group ID
        in: query
        name: groupId
        type: string
      - description: Filter for personal only (true/false)
        in: query
        name: personal
        type: boolean
      - description: Filter by Friend ID
        in: query
        name: friendId
        type: string
      - description: Items per page (max 100, default 20)
        in: query
        name: limit
        type: integer
      - description: Opaque cursor token from a previous response
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Page-Expense_ExpenseWithSplits'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Common.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Common.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Common.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List expenses
      tags:
      - expenses
    post:
      consumes:
      - application/json
      description: Create a new expense with equal/exact/percentage splits.
      parameters:
      - description: Expense details and splits structure
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/Expense.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/Expense.ExpenseWithSplits'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Common.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Common.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Common.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create expense
      tags:
      - expenses
  /expenses/{id}:
    delete:
      description: Soft-delete an expense by ID.
      parameters:
      - description: Expense ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Common.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Common.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/Common.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Common.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Common.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete expense
      tags:
      - expenses
    get:
      description: Get a specific expense's details including all splits.
      parameters:
      - description: Expense ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Expense.ExpenseWithSplits'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Common.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Common.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/Common.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Common.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/Common.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get expense details
      tags:
      - expenses
    patch:
      consumes:
      - application/json
      description: Partially update description, amount, currency, category, or splits
        for an expense.
      parameters:
      - description: Expense UUID
        in: path
        name: id
        required: true
        type: string
      - description: Update Expense Payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/Expense.UpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Expense.ExpenseWithSplits'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Common.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Common.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/Common.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Common.ErrorResponse'
        "500":
