components:
  schemas:
    activity.FeedResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/domain.Activity'
          type: array
          uniqueItems: false
        pagination:
          $ref: '#/components/schemas/pagination.Meta'
      type: object
    appconfig.AppConfigData:
      properties:
        domain:
          $ref: '#/components/schemas/appconfig.DomainConfig'
        featureFlags:
          additionalProperties:
            type: boolean
          type: object
        legal:
          $ref: '#/components/schemas/appconfig.LegalConfig'
        system:
          $ref: '#/components/schemas/appconfig.SystemConfig'
        userContext:
          $ref: '#/components/schemas/appconfig.UserContext'
      type: object
    appconfig.AppVersion:
      properties:
        forceUpdate:
          type: boolean
        latestVersion:
          type: string
        minSupportedVersion:
          type: string
        updateMessage:
          type: string
        updateUrl:
          additionalProperties:
            type: string
          type: object
      type: object
    appconfig.Category:
      properties:
        iconUrl:
          type: string
        id:
          type: string
        name:
          type: string
      type: object
    appconfig.Currency:
      properties:
        code:
          type: string
        decimalPlaces:
          type: integer
        isDefault:
          type: boolean
        name:
          type: string
        symbol:
          type: string
      type: object
    appconfig.DomainConfig:
      properties:
        categories:
          items:
            $ref: '#/components/schemas/appconfig.Category'
          type: array
          uniqueItems: false
        currencies:
          items:
            $ref: '#/components/schemas/appconfig.Currency'
          type: array
          uniqueItems: false
        limits:
          $ref: '#/components/schemas/appconfig.LimitsConfig'
        paymentIntegrations:
          items:
            $ref: '#/components/schemas/appconfig.PaymentIntegration'
          type: array
          uniqueItems: false
        splitTypes:
          items:
            $ref: '#/components/schemas/appconfig.SplitTypeConfig'
          type: array
          uniqueItems: false
      type: object
    appconfig.LegalConfig:
      properties:
        faqUrl:
          type: string
        privacyPolicyUrl:
          type: string
        supportEmail:
          type: string
        termsOfServiceUrl:
          type: string
      type: object
    appconfig.LimitsConfig:
      properties:
        allowedReceiptMimeTypes:
          items:
            type: string
          type: array
          uniqueItems: false
        maxExpenseAmount:
          type: number
        maxGroupMembers:
          type: integer
        maxReceiptSizeMb:
          type: integer
        maxSplitParticipants:
          type: integer
      type: object
    appconfig.MaintenanceConfig:
      properties:
        estimatedEndTime:
          type: string
        inMaintenance:
          type: boolean
        message:
          type: string
        readOnlyMode:
          type: boolean
      type: object
    appconfig.PaymentIntegration:
      properties:
        deepLinkScheme:
          type: string
        enabled:
          type: boolean
        id:
          type: string
        name:
          type: string
      type: object
    appconfig.SplitTypeConfig:
      properties:
        code:
          type: string
        description:
          type: string
        label:
          type: string
      type: object
    appconfig.SystemConfig:
      properties:
        appVersion:
          $ref: '#/components/schemas/appconfig.AppVersion'
        maintenance:
          $ref: '#/components/schemas/appconfig.MaintenanceConfig'
      type: object
    appconfig.UserContext:
      properties:
        isAuthenticated:
          type: boolean
        userFeatureFlags:
          additionalProperties: {}
          type: object
        userPreferredCurrency:
          type: string
      type: object
    domain.ActionType:
      enum:
      - EXPENSE_CREATED
      - SETTLEMENT
      - MEMBER_ADDED
      - MEMBER_LEFT
      - MEMBER_KICKED
      - MEMBER_ROLE_UPDATED
      - GROUP_CREATED
      - GROUP_UPDATED
      - GROUP_ARCHIVED
      - MEMBER_JOINED
      - MEMBER_KICKED
      type: string
      x-enum-varnames:
      - ActionTypeExpenseCreated
      - ActionTypeSettlementCreated
      - ActionTypeMemberAdded
      - ActionTypeMemberLeft
      - ActionTypeMemberKicked
      - ActionTypeMemberRoleUpdated
      - ActionTypeGroupCreated
      - ActionTypeGroupUpdated
      - ActionTypeGroupArchived
      - ActionTypeMemberJoined
      - ActionTypeMemberRemoved
    domain.Activity:
      properties:
        actionType:
          $ref: '#/components/schemas/domain.ActionType'
        actor:
          $ref: '#/components/schemas/domain.ActorInfo'
        createdAt:
          type: string
        description:
          type: string
        entityId:
          type: string
        entityType:
          $ref: '#/components/schemas/domain.EntityType'
        groupId:
          type: string
        id:
          type: string
        payload:
          type: object
      type: object
    domain.ActorInfo:
      properties:
        id:
          type: string
        name:
          type: string
      type: object
    domain.EntityType:
      enum:
      - EXPENSE
      - SETTLEMENT
      - MEMBER
      - GROUP
      type: string
      x-enum-varnames:
      - EntityTypeExpense
      - EntityTypeSettlement
      - EntityTypeMember
      - EntityTypeGroup
    expense.BalanceResponse:
      properties:
        balances:
          items:
            $ref: '#/components/schemas/expense.UserBalance'
          type: array
          uniqueItems: false
        settlements:
          items:
            $ref: '#/components/schemas/expense.Settlement'
          type: array
          uniqueItems: false
      type: object
    expense.CreateExpenseResponse:
      properties:
        expense:
          $ref: '#/components/schemas/expense.Expense'
        splits:
          items:
            $ref: '#/components/schemas/expense.Split'
          type: array
          uniqueItems: false
      type: object
    expense.Expense:
      properties:
        amount:
          type: number
        category:
          type: string
        createdAt:
          type: string
        createdBy:
          type: string
        currency:
          type: string
        deletedAt:
          type: string
        description:
          type: string
        groupId:
          type: string
        id:
          type: string
        isPayment:
          type: boolean
        paidBy:
          type: string
        spentAt:
          type: string
        updatedAt:
          type: string
      type: object
    expense.GetExpenseDetailsResponse:
      properties:
        expense:
          $ref: '#/components/schemas/expense.Expense'
        splits:
          items:
            $ref: '#/components/schemas/expense.Split'
          type: array
          uniqueItems: false
      type: object
    expense.InputSplit:
      properties:
        amount:
          description: Required if splitType is EXACT
          type: number
        percentage:
          description: Required if splitType is PERCENTAGE
          type: number
        userId:
          type: string
      type: object
    expense.ListExpensesResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/expense.Expense'
          type: array
          uniqueItems: false
        pagination:
          $ref: '#/components/schemas/pagination.Meta'
      type: object
    expense.SettleExpenseResponse:
      properties:
        expense:
          $ref: '#/components/schemas/expense.Expense'
        split:
          $ref: '#/components/schemas/expense.Split'
      type: object
    expense.Settlement:
      properties:
        amount:
          type: number
        fromUserId:
          type: string
        fromUserName:
          type: string
        toUserId:
          type: string
        toUserName:
          type: string
      type: object
    expense.Split:
      properties:
        amount:
          type: number
        email:
          type: string
        expenseId:
          type: string
        name:
          type: string
        phone:
          type: string
        splitType:
          $ref: '#/components/schemas/expense.SplitType'
        splitValue:
          type: number
        userId:
          type: string
      type: object
    expense.SplitType:
      enum:
      - EQUAL
      - EXACT
      - PERCENTAGE
      type: string
      x-enum-varnames:
      - SplitTypeEqual
      - SplitTypeExact
      - SplitTypePercentage
    expense.UserBalance:
      properties:
        netBalance:
          type: number
        userId:
          type: string
        userName:
          type: string
      type: object
    expense.createExpenseRequest:
      properties:
        amount:
          type: number
        category:
          type: string
        currency:
          type: string
        description:
          type: string
        groupId:
          type: string
        paidBy:
          type: string
        splitType:
          $ref: '#/components/schemas/expense.SplitType'
        splits:
          items:
            $ref: '#/components/schemas/expense.InputSplit'
          type: array
          uniqueItems: false
      type: object
    expense.settleExpenseRequest:
      properties:
        amount:
          type: number
        currency:
          type: string
        groupId:
          type: string
        paidBy:
          type: string
        receivedBy:
          type: string
      type: object
    group.DecideJoinRequestPayload:
      properties:
        action:
          description: '"APPROVE" or "REJECT"'
          type: string
      type: object
    group.DetailsResponse:
      properties:
        archivedAt:
          type: string
        createdAt:
          type: string
        createdBy:
          type: string
        description:
          type: string
        id:
          type: string
        inviteCode:
          type: string
        inviteCodeExpiresAt:
          type: string
        members:
          items:
            $ref: '#/components/schemas/group.Member'
          type: array
          uniqueItems: false
        name:
          type: string
        requireAdminApproval:
          type: boolean
        updatedAt:
          type: string
      type: object
    group.Group:
      properties:
        archivedAt:
          type: string
        createdAt:
          type: string
        createdBy:
          type: string
        description:
          type: string
        id:
          type: string
        inviteCode:
          type: string
        inviteCodeExpiresAt:
          type: string
        name:
          type: string
        requireAdminApproval:
          type: boolean
        updatedAt:
          type: string
      type: object
    group.JoinResponse:
      properties:
        group:
          $ref: '#/components/schemas/group.Group'
        message:
          type: string
        status:
          type: string
      type: object
    group.ListGroupsResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/group.DetailsResponse'
          type: array
          uniqueItems: false
        pagination:
          $ref: '#/components/schemas/pagination.Meta'
      type: object
    group.Member:
      properties:
        email:
          type: string
        groupId:
          type: string
        joinedAt:
          type: string
        name:
          type: string
        phone:
          type: string
        role:
          type: string
        status:
          type: string
        userId:
          type: string
      type: object
    group.Preview:
      properties:
        creatorName:
          type: string
        description:
          type: string
        memberCount:
          type: integer
        name:
          type: string
        requireAdminApproval:
          type: boolean
      type: object
    group.addMemberRequest:
      properties:
        userId:
          type: string
      type: object
    group.createGroupRequest:
      properties:
        description:
          type: string
        name:
          type: string
        requireAdminApproval:
          type: boolean
      type: object
    group.joinGroupRequest:
      properties:
        inviteCode:
          type: string
      type: object
    group.updateRoleRequest:
      properties:
        role:
          type: string
      type: object
    http.ListActivitiesResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/domain.Activity'
          type: array
          uniqueItems: false
        pagination:
          $ref: '#/components/schemas/pagination.Meta'
      type: object
    notification.ListNotificationsResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/notification.Notification'
          type: array
          uniqueItems: false
        pagination:
          $ref: '#/components/schemas/pagination.Meta'
      type: object
    notification.Notification:
      properties:
        activityId:
          type: string
        actorId:
          type: string
        actorName:
          type: string
        content:
          type: string
        createdAt:
          type: string
        id:
          type: string
        isRead:
          type: boolean
        title:
          type: string
        userId:
          type: string
      type: object
    pagination.Meta:
      properties:
        hasMore:
          type: boolean
        nextCursor:
          type: string
      type: object
    response.ErrorResponse:
      properties:
        code:
          type: string
        message:
          type: string
      type: object
    response.MessageResponse:
      properties:
        message:
          type: string
      type: object
    user.ListFriendsResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/user.User'
          type: array
          uniqueItems: false
        pagination:
          $ref: '#/components/schemas/pagination.Meta'
      type: object
    user.User:
      properties:
        createdAt:
          type: string
        defaultCurrency:
          type: string
        email:
          type: string
        id:
          type: string
        name:
          type: string
        phone:
          type: string
        updatedAt:
          type: string
      type: object
    user.addFriendRequest:
      properties:
        friendEmail:
          type: string
        friendPhone:
          type: string
      type: object
    user.registerRequest:
      properties:
        name:
          type: string
      type: object
    user.updateProfileRequest:
      properties:
        defaultCurrency:
          type: string
        name:
          type: string
      type: object
  securitySchemes:
    BearerAuth:
      scheme: bearer
      type: http
externalDocs:
  description: ""
  url: ""
info:
  description: Backend API service for Splittr bill splitting.
  title: Splittr API
  version: "1.0"
openapi: 3.1.0
paths:
  /activities:
    get:
      description: Get a cursor-paginated list of activities visible to the current
        user.
      parameters:
      - description: Items per page (max 100, default 20)
        in: query
        name: limit
        schema:
          type: integer
      - description: Opaque cursor token from a previous response
        in: query
        name: cursor
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.ListActivitiesResponse'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: List activity feed
      tags:
      - activities
  /app-config:
    get:
      description: Returns app version rules, maintenance status, expense categories,
        currencies, limits, feature flags, and legal links. Supports optional Bearer
        auth and ETag caching via If-None-Match.
      parameters:
      - description: ETag hash for cache validation
        in: header
        name: If-None-Match
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/appconfig.AppConfigData'
          description: OK
        "304":
          description: Not Modified
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Internal Server Error
      summary: Fetch application startup configuration
      tags:
      - appConfig
  /balances:
    get:
      description: Calculate net balances and recommended settlement transactions.
      parameters:
      - description: Filter by Group ID. If omitted, returns global balances.
        in: query
        name: groupId
        schema:
          type: string
      - description: Simplify debts algorithm (true/false)
        in: query
        name: simplified
        schema:
          type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/expense.BalanceResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Get user balances
      tags:
      - expenses
  /expenses:
    get:
      description: Retrieve a cursor-paginated list of expenses filtered by group,
        personal=true, or friendId.
      parameters:
      - description: Filter by Group ID
        in: query
        name: groupId
        schema:
          type: string
      - description: Filter for personal only (true/false)
        in: query
        name: personal
        schema:
          type: boolean
      - description: Filter by Friend ID
        in: query
        name: friendId
        schema:
          type: string
      - description: Items per page (max 100, default 20)
        in: query
        name: limit
        schema:
          type: integer
      - description: Opaque cursor token from a previous response
        in: query
        name: cursor
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/expense.ListExpensesResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: List expenses
      tags:
      - expenses
    post:
      description: Create a new expense with equal/exact/percentage splits.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/expense.createExpenseRequest'
                description: Expense details and splits structure
                summary: request
        description: Expense details and splits structure
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/expense.CreateExpenseResponse'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Create expense
      tags:
      - expenses
  /expenses/{id}:
    delete:
      description: Soft-delete an expense by ID.
      parameters:
      - description: Expense ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Delete expense
      tags:
      - expenses
    get:
      description: Get a specific expense's details including all splits.
      parameters:
      - description: Expense ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/expense.GetExpenseDetailsResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Get expense details
      tags:
      - expenses
  /expenses/settle:
    post:
      description: Create a settlement payment between two users.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/expense.settleExpenseRequest'
                description: Settlement details
                summary: request
        description: Settlement details
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/expense.SettleExpenseResponse'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Settle balance
      tags:
      - expenses
  /friends:
    get:
      description: Get a cursor-paginated list of the current user's friends.
      parameters:
      - description: Items per page (max 100, default 20)
        in: query
        name: limit
        schema:
          type: integer
      - description: Opaque cursor token from a previous response
        in: query
        name: cursor
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/user.ListFriendsResponse'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: List friends
      tags:
      - friends
    post:
      description: Create a friendship link with another user by their email or phone.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/user.addFriendRequest'
                description: Friend email or phone
                summary: request
        description: Friend email or phone
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/user.User'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Add friend
      tags:
      - friends
  /friends/{friendId}:
    delete:
      description: Delete a friendship link by friend ID.
      parameters:
      - description: Friend ID
        in: path
        name: friendId
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/response.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Remove friend
      tags:
      - friends
  /groups:
    get:
      description: Retrieve a cursor-paginated list of groups the current user belongs
        to.
      parameters:
      - description: Items per page (max 100, default 20)
        in: query
        name: limit
        schema:
          type: integer
